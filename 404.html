<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shaheen Star Academy</title></head><body>
<p>Page not found. Redirecting…</p>
<script>
(function(){
  var p=location.pathname;
  var base='/';
  if(location.hostname.endsWith('.github.io')){
    var parts=p.split('/').filter(Boolean);
    if(parts.length) base='/' + parts[0] + '/';
  }
  location.replace(location.origin + base);
})();
</script>
</body></html>
